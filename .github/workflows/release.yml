name: Release

# Tag a version and this uploads it to the Chrome Web Store.
#
#   npm version minor          # bumps package.json + manifest.json, commits, tags
#   git push --follow-tags     # the tag is what triggers this
#
# "Publish" still means "submit for review". This removes the clicking, not the
# wait. The first release had to be done by hand — the listing, screenshots,
# privacy answers and permission justifications are dashboard-only and the API
# cannot create them.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Submit for review. Off uploads a draft you publish by hand.'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 is not optional: the test suite runs .ts sources directly
          # through type stripping, and package.mjs runs as part of the build.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check the tag matches the version being built
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          manifest=$(node -p "require('./public/manifest.json').version")
          echo "tag=$tag package.json=$pkg manifest.json=$manifest"

          # package.mjs already refuses on a pkg/manifest mismatch. This adds the
          # third value, the tag — pushing v1.2.0 from a commit still on 1.1.0
          # would otherwise release 1.1.0 under a name that says otherwise, and
          # the Store rejects a version number it has already seen.
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($pkg) / manifest.json ($manifest)"
            exit 1
          fi

      # No separate build step: `release` and `release:draft` both run `npm run
      # package` first — typecheck, tests, clean build, then a zip with
      # manifest.json at the archive root. A broken build cannot reach the Store.
      - name: Build and upload to the Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          # Fail loudly on a missing secret. Without this the CLI fails deep in an
          # OAuth error that does not name which of the five is absent.
          for name in EXTENSION_ID PUBLISHER_ID CLIENT_ID CLIENT_SECRET REFRESH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is not set on this repository"
              exit 1
            fi
          done

          # No command means upload *and* publish; `upload` alone leaves a draft.
          # There is no --auto-publish flag, and passing one is silently ignored.
          if [ "${{ inputs.publish }}" = "false" ]; then
            npm run release:draft
          else
            npm run release
          fi
